name: API Tests (Newman)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      # Step 1 — get your code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2 — install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Step 3 — install Newman and the HTML reporter
      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      # Step 4 — run the API tests
      - name: Run API tests
        run: |
          newman run JSONPlaceholder.postman_collection.json \
            -e JSONPlaceholder.postman_environment.json \
            -r cli,htmlextra
        working-directory: week3

      # Step 5 — upload the HTML report (even if tests fail)
      - name: Upload Newman report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-report
          path: week3/newman/
          retention-days: 30